<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Advanced Sudoku</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A modern, minimalist Sudoku that teaches solving techniques."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Apply persisted appearance settings before first paint (shape: SettingsStore). -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('advsudoku:v1:settings') || '{}');
        var root = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') root.dataset.theme = s.theme;
        if (s.reducedMotion === 'on') root.dataset.motion = 'reduced';
        if (s.reducedMotion === 'off') root.dataset.motion = 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
